name: App test on emulator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saathi
          POSTGRES_PASSWORD: saathi
          POSTGRES_DB: saathi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saathi" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://saathi:saathi@localhost:5432/saathi
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-3.8-flash' }}  # repo variable: switch model without a commit
      DASHBOARD_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      PUBLIC_BASE_URL: http://10.0.2.2:8000
      SEED_SHOPKEEPER_PHONE: "919800000001"
      SEED_SHOPKEEPER_NAME: Demo Store
      SEED_PROFESSOR_PHONE: "919800000002"
      SEED_PIN: "123456"
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Start backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python seed.py
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          sleep 5 && curl -sf localhost:8000/health

      - name: Build app
        run: gradle -p android assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: adb install -r android/app/build/outputs/apk/debug/app-debug.apk && python3 .github/e2e/drive.py

      - name: Save results to the e2e-results branch
        if: always()
        run: |
          mkdir -p e2e-out && cp server.log e2e-out/ || true
          git config user.name "saathi-ci"
          git config user.email "saathi-ci@users.noreply.github.com"
          git checkout --orphan e2e-results
          git rm -rq --cached . && git add -f e2e-out
          git commit -qm "E2E results for ${GITHUB_SHA::7}"
          git push -f origin e2e-results
