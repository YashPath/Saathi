name: Build app and test backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Debug APK (install directly on a phone)
        run: gradle -p android assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}

      # Release build only when the signing secrets exist (see README: "Publish to Play internal testing").
      - name: Signed release bundle for Google Play
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          gradle -p android bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: saathi-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saathi
          POSTGRES_PASSWORD: saathi
          POSTGRES_DB: saathi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saathi" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q -p no:warnings
        env:
          TEST_DATABASE_URL: postgresql+psycopg://saathi:saathi@localhost:5432/saathi_test
